<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Colaboradores</title>
</head>
<body>

    <h1>Colaboradores</h1>

    <!-- Botão para cadastrar novo -->
    <a href="{% url 'criar_colaborador' %}">+ Novo Colaborador</a>

    <br><br>

    <!-- Tabela de listagem -->
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for c in colaboradores %}
            <tr>
                <td>{{ c.id }}</td>
                <td>{{ c.nome }}</td>
                <td>{{ c.telefone }}</td>
                <td>
                    <a href="{% url 'editar_colaborador' c.pk %}">Editar</a> | 
                    <a href="{% url 'excluir_colaborador' c.pk %}">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nenhum colaborador encontrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
